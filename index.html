<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Git Practice Simulator - Merge Added</title>
    <script src="https://cdn.jsdelivr.net/npm/@gitgraph/js"></script>
<style>
    :root { 
        --bg: #0d1117; 
        --panel: #161b22; 
        --border: #30363d; 
        --text: #c9d1d9; 
        --green: #238636;  /* Standard Git Green */
        --blue: #2980b9;   /* Deeper Blue to contrast Orange */
        --red: #f85149; 
        --yellow: #f1c40f; 
        --brand-orange: #df691a; /* Your Qwallity Orange */
    }

    body { 
        margin: 0; 
        background: var(--bg); 
        color: var(--text); 
        font-family: 'Consolas', 'Monaco', monospace; 
        display: flex; 
        flex-direction: column; 
        height: 100vh; 
        overflow: hidden; 
    }

    .header { 
        padding: 10px 20px; 
        background: #010409; 
        border-bottom: 1px solid var(--border); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }

    .layout { display: flex; flex: 1; gap: 8px; padding: 10px; overflow: hidden; }

    .column { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        border: 1px solid var(--border); 
        border-radius: 8px; 
        background: var(--panel); 
        overflow: hidden; 
    }

    .header-col { 
        padding: 8px; 
        background: #161b22; 
        border-bottom: 1px solid var(--border); 
        text-align: center; 
        font-size: 11px; 
        text-transform: uppercase; 
        color: #8b949e; 
        font-weight: bold;
    }

    .editor { 
        flex: 1; 
        padding: 15px; 
        overflow-y: auto; 
        font-size: 13px; 
        background: #010409; 
        line-height: 1.6; 
        outline: none; 
        white-space: pre-wrap; 
        color: #7ee787; /* Code Green */
        border: 2px solid transparent; 
    }

    /* Primary Action Buttons */
    .btn-green { 
        background: var(--green) !important; 
        color: #ffffff;
        border: none; 
        font-weight: bold; 
        transition: opacity 0.2s;
    }

    /* Secondary Action Buttons (Pull/Branch) */
    .btn-blue {
        background: var(--blue) !important;
        color: #ffffff;
        border: none;
    }

    /* Alert/Merge Buttons */
    .btn-yellow {
        background: var(--brand-orange) !important;
        color: white;
        border: none;
        font-weight: bold;
    }

    .controls { 
        padding: 12px; 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 8px; 
        border-top: 1px solid var(--border); 
        background: var(--panel);
    }

    button:hover { opacity: 0.8; }

    select, input, button { 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid var(--border); 
        background: #21262d; 
        color: white; 
        font-size: 12px; 
        cursor: pointer; 
    }

    #terminal { 
        background: #000; 
        color: #0f0; 
        font-size: 11px; 
        padding: 10px; 
        height: 100px; 
        overflow-y: auto; 
        border-top: 1px solid var(--border); 
        font-family: 'Courier New', monospace;
    }

    /* GitGraph Panel Sync */
#graph-panel {
    width: 500px; 
    flex-shrink: 0; 
    background: var(--bg);
    padding: 10px;
    border-left: 1px solid var(--border);
    overflow-x: hidden; 
}


#graph-container {
    background: var(--panel);
    padding: 10px;
    border-radius: 8px;
    min-height: 100%;
    width: 100%;
    box-sizing: border-box;
}


#graph-container svg {
    max-width: 100%;
    height: auto;
}
#graph-container svg text {
    font-size: 14px !important;   
}

</style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold; color: #df691a;">QWALLITY Git Lab</div>
    <div>Branch: <select id="branchSelect" onchange="switchBranch()"></select></div>
</div>

<div class="layout">
    <div class="column">
        <div class="header-col">☁️ Remote (origin/master)</div>
        <div id="remote-editor" class="editor"></div>
        <div class="controls"><button onclick="simulateRemoteChange()" style="background: #df691a; border:none; grid-column: span 2;">Simulate Teammate Push</button></div>
    </div>

    <div class="column">
        <div class="header-col">💻 Local Machine</div>
        <div id="local-editor" class="editor" contenteditable="false"></div>
        <div class="controls">
            <input type="text" id="commitInput" placeholder="Commit message..." style="grid-column: span 2;">
            <button onclick="gitCommit()" class="btn-green">git commit</button>
            <button onclick="gitPush()" class="btn-green">git push</button>
            <button onclick="gitPull()" style="background: var(--blue); border:none;">git pull</button>
            <button onclick="createNewBranch()" style="background: var(--blue); border:none;">git branch</button>
            <button onclick="gitMerge()" class="btn-yellow">git merge</button>
            <button onclick="resolveConflict()" id="resBtn" style="display:none; grid-column: span 2; background: var(--yellow); color: black; font-weight: bold;">RESOLVE CONFLICT</button>
        </div>
        <div id="terminal"></div>
    </div>

    <div id="graph-panel"><div id="graph-container"></div></div>
</div>

<script>
    const gitgraph = GitgraphJS.createGitgraph(document.getElementById("graph-container"), { template: "metro", orientation: "vertical-reverse" });
    
    let branchData = { "master": "// Initial Code" };
    let remoteData = "// Initial Code";
    let branches = { "master": gitgraph.branch("master") };
    let currentBranchName = "master";
    
    let isConflict = false;
    let needsCommitAfterResolve = false;
    let hasMergedRemote = false;
    let mergeSourceBranch = ""; // Tracks which branch is being merged in

    branches["master"].commit("Initial");
    updateUI();

    function log(msg, color = "#0f0") {
        const term = document.getElementById("terminal");
        term.innerHTML += `<div><span style="color:#888">></span> <span style="color:${color}">${msg}</span></div>`;
        term.scrollTop = term.scrollHeight;
    }

    function updateUI() {
        const select = document.getElementById("branchSelect");
        select.innerHTML = Object.keys(branches).map(b => `<option value="${b}" ${b===currentBranchName?'selected':''}>${b}</option>`).join('');
        document.getElementById("remote-editor").innerText = remoteData;
        
        const localEditor = document.getElementById("local-editor");
        if (!isConflict) {
            localEditor.innerText = branchData[currentBranchName];
            localEditor.contentEditable = "false";
            localEditor.classList.remove("conflict-mode");
            document.getElementById("resBtn").style.display = "none";
        }
    }

    function gitMerge() {
        const target = prompt("Enter branch name to merge INTO " + currentBranchName + ":");
        if (!target || !branches[target]) return log("Branch not found.", "var(--red)");
        if (target === currentBranchName) return log("Cannot merge branch into itself.");

        log(`git merge ${target}`);
        
        if (branchData[target].trim() === branchData[currentBranchName].trim()) {
            log("Already up to date.");
        } else {
            // Check for conflict (simulated by checking if content of target is just an addition)
            if (branchData[target].includes(branchData[currentBranchName])) {
                // Fast-forward
                branchData[currentBranchName] = branchData[target];
                branches[currentBranchName].merge(branches[target]);
                log(`Fast-forward: ${currentBranchName} updated.`, "var(--blue)");
            } else {
                // Conflict
                isConflict = true;
                mergeSourceBranch = target;
                const localEditor = document.getElementById("local-editor");
                localEditor.contentEditable = "true";
                localEditor.classList.add("conflict-mode");
                localEditor.innerText = `<<<<<<< HEAD (${currentBranchName})\n${branchData[currentBranchName]}\n=======\n${branchData[target]}\n>>>>>>> ${target}`;
                document.getElementById("resBtn").style.display = "block";
                log("CONFLICT! Merge conflict in file. Resolve and click button.", "var(--red)");
            }
        }
        updateUI();
    }

    function gitPull() {
        log("git pull origin master");
        hasMergedRemote = false;

        if (remoteData.trim() !== branchData["master"].trim()) {
            if (remoteData.trim().startsWith(branchData["master"].trim())) {
                branchData["master"] = remoteData;
                log("Fast-forward: Local updated.", "var(--blue)");
            } else {
                isConflict = true;
                mergeSourceBranch = "origin/master";
                const localEditor = document.getElementById("local-editor");
                localEditor.contentEditable = "true";
                localEditor.classList.add("conflict-mode");
                localEditor.innerText = `<<<<<<< HEAD\n${branchData["master"]}\n=======\n${remoteData}\n>>>>>>> origin/master`;
                document.getElementById("resBtn").style.display = "block";
                log("CONFLICT! Fix file then RESOLVE.", "var(--red)");
            }
        } else {
            log("Already up to date.");
        }
        updateUI();
    }

    function resolveConflict() {
        const localDiv = document.getElementById("local-editor");
        if (localDiv.innerText.includes("<<<<<<<")) return alert("Remove markers!");
        
        branchData[currentBranchName] = localDiv.innerText.trim();
        isConflict = false;
        needsCommitAfterResolve = true;
        
        log("Conflict resolved locally. 'git commit' to complete merge.", "var(--yellow)");
        updateUI();
    }

    function gitCommit() {
        const msgInput = document.getElementById("commitInput");
        const msg = msgInput.value || "Update";
        if (isConflict) return log("Resolve conflicts first!", "var(--red)");

        if (needsCommitAfterResolve) {
            const finalMsg = mergeSourceBranch ? `Merge branch '${mergeSourceBranch}'` : "Merge resolution";
            
            // Visual merge on graph if it was a branch merge
            if (branches[mergeSourceBranch]) {
                branches[currentBranchName].merge(branches[mergeSourceBranch]);
            } else {
                branches[currentBranchName].commit(finalMsg);
            }

            needsCommitAfterResolve = false;
            hasMergedRemote = (mergeSourceBranch === "origin/master");
            mergeSourceBranch = "";
            log(`git commit: ${finalMsg} completed.`, "var(--green)");
        } else {
            branchData[currentBranchName] += "\n" + msg;
            branches[currentBranchName].commit(msg);
            log(`git commit: ${msg}`);
            hasMergedRemote = false;
        }
        msgInput.value = "";
        updateUI();
    }

    function gitPush() {
        if (currentBranchName !== "master") return log("Sim: Push from master only.");
        if (isConflict) return log("Rejected: Resolve conflicts before pushing.", "var(--red)");
        if (needsCommitAfterResolve) return log("Rejected: Commit merge resolution first.", "var(--yellow)");

        const contentMatches = branchData["master"].trim().includes(remoteData.trim());

        if (hasMergedRemote || contentMatches) {
            remoteData = branchData["master"];
            hasMergedRemote = false; 
            log("git push: SUCCESS! Remote updated.", "var(--green)");
        } else {
            log("Rejected: Remote contains work you don't have. Pull first!", "var(--red)");
        }
        updateUI();
    }

    function simulateRemoteChange() {
        remoteData += "\n// Change from teammate";
        log("Teammate pushed to remote.", "var(--red)");
        updateUI();
    }

    function createNewBranch() {
        const name = prompt("Branch name:");
        if (name && !branches[name]) {
            branches[name] = branches[currentBranchName].branch(name);
            branchData[name] = branchData[currentBranchName];
            currentBranchName = name;
            log(`git checkout -b ${name}`);
            updateUI();
        }
    }

    function switchBranch() {
        currentBranchName = document.getElementById("branchSelect").value;
        log(`git checkout ${currentBranchName}`);
        updateUI();
    }
</script>
</body>
</html>
